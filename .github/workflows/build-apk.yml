name: Build & Release AutoPoster v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "AutoPoster_v2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Projekt sauber entpacken
        run: |
          set -euo pipefail
          rm -rf AutoPoster AutoPoster.apk
          unzip -o AutoPoster_v2.zip
          test -f AutoPoster/app/build.gradle.kts
          test -f AutoPoster/app/src/main/AndroidManifest.xml

      - name: Signierschlüssel robust rekonstruieren
        env:
          KEYSTORE_B64: ${{ secrets.AUTPOSTER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, hashlib, sys

          raw = os.environ.get("KEYSTORE_B64", "")
          if not raw.strip():
              sys.exit("AUTPOSTER_KEYSTORE_B64 fehlt")

          EXPECTED_SHA = "a591601ffc288b091c5812fdc4bc0053851316aa7fc1d5c211b5e6361ffda82f"
          EXPECTED_BYTES = 3520
          EXPECTED_B64_LEN = 4696
          B64CHARS = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")

          def decode_if_expected(enc):
              try:
                  if len(enc) % 4:
                      return None
                  data = base64.b64decode(enc, validate=True)
              except Exception:
                  return None
              if len(data) != EXPECTED_BYTES:
                  return None
              if hashlib.sha256(data).hexdigest() != EXPECTED_SHA:
                  return None
              return data

          cleaned = "".join(raw.replace("AUTPOSTER_KEYSTORE_B64", "").split())
          cleaned = "".join(ch for ch in cleaned if ch in B64CHARS)

          candidates = []
          if cleaned:
              candidates.append(cleaned)

          known_start = cleaned.find("MIINvA")
          if known_start >= 0:
              candidates.append(cleaned[known_start:])

          data = None
          for c in dict.fromkeys(candidates):
              data = decode_if_expected(c)
              if data is not None:
                  break

              # Korrekte 4696-Zeichen-Folge innerhalb eines versehentlich
              # mitkopierten Präfixes/Suffixes finden.
              if len(c) >= EXPECTED_B64_LEN:
                  for i in range(len(c) - EXPECTED_B64_LEN + 1):
                      data = decode_if_expected(c[i:i + EXPECTED_B64_LEN])
                      if data is not None:
                          break
                  if data is not None:
                      break

              # Bekannter Copy/Paste-Fall: exakt ein zusätzliches gültiges
              # Base64-Zeichen. Nur ein Kandidat mit dem festen SHA-256 wird
              # akzeptiert.
              if len(c) == EXPECTED_B64_LEN + 1:
                  for i in range(len(c)):
                      data = decode_if_expected(c[:i] + c[i+1:])
                      if data is not None:
                          print("Keystore-Secret automatisch repariert: 1 zusätzliches Zeichen entfernt")
                          break
                  if data is not None:
                      break

          if data is None:
              sys.exit(
                  "Keystore konnte nicht eindeutig rekonstruiert werden. "
                  f"Bereinigte Länge={len(cleaned)}, erwartet={EXPECTED_B64_LEN}."
              )

          out = os.path.join(os.environ["RUNNER_TEMP"], "autoposter-release.jks")
          with open(out, "wb") as f:
              f.write(data)
          print(f"Keystore OK: {len(data)} Bytes, SHA-256 geprüft")
          PY

      - name: Privaten Signierschlüssel vollständig prüfen
        env:
          STORE_PASSWORD: ${{ secrets.AUTPOSTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTPOSTER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || (echo "AUTPOSTER_STORE_PASSWORD fehlt" && exit 1)
          test -n "$KEY_ALIAS" || (echo "AUTPOSTER_KEY_ALIAS fehlt" && exit 1)

          # Store + Alias prüfen.
          keytool -list \
            -keystore "$RUNNER_TEMP/autoposter-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          # Nicht nur den Store lesen: den PRIVATE KEY wirklich abrufen und
          # damit testweise ein JAR signieren. Damit wird ein Passwortproblem
          # vor Gradle erkannt. Der Keystore wurde mit identischem Store- und
          # Key-Passwort erzeugt, daher verwenden wir bewusst nur STORE_PASSWORD.
          TMPDIR_SIGN="$RUNNER_TEMP/autoposter-sign-test"
          mkdir -p "$TMPDIR_SIGN/content"
          printf 'AutoPoster signing preflight\n' > "$TMPDIR_SIGN/content/check.txt"
          jar --create --file "$TMPDIR_SIGN/unsigned.jar" -C "$TMPDIR_SIGN/content" .
          jarsigner \
            -keystore "$RUNNER_TEMP/autoposter-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -signedjar "$TMPDIR_SIGN/signed.jar" \
            "$TMPDIR_SIGN/unsigned.jar" \
            "$KEY_ALIAS" >/dev/null
          jarsigner -verify "$TMPDIR_SIGN/signed.jar" >/dev/null

          echo "Privater Signierschlüssel vollständig geprüft"

      - name: Signierte Release-APK bauen
        working-directory: AutoPoster
        env:
          AUTPOSTER_KEYSTORE_PATH: ${{ runner.temp }}/autoposter-release.jks
          AUTPOSTER_STORE_PASSWORD: ${{ secrets.AUTPOSTER_STORE_PASSWORD }}
          AUTPOSTER_KEY_ALIAS: ${{ secrets.AUTPOSTER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleRelease --stacktrace --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../AutoPoster.apk

      - name: APK und Zertifikat prüfen
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs AutoPoster.apk | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Eqi "certificate SHA-256 digest: a3f354dbe874d87c8d532e7543bbc14a38ff319d449b48cd33c212a7c197bf86" "$RUNNER_TEMP/apksigner.txt"
          echo "APK-Signatur und erwartetes AutoPoster-Zertifikat OK"

      - name: Version ermitteln
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import re
          text = open("AutoPoster/app/build.gradle.kts", encoding="utf-8").read()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("versionName nicht gefunden")
          print(m.group(1))
          PY
          )
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-${{ steps.version.outputs.version }}-signed
          path: AutoPoster.apk
          if-no-files-found: error

      - name: GitHub Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AutoPoster.apk --clobber
          else
            gh release create "$TAG" AutoPoster.apk \
              --title "AutoPoster $TAG" \
              --notes "Signierte AutoPoster-Version. Installation und spätere Updates über Android." \
              --latest
          fi

      - name: Abschlussprüfung
        run: |
          set -euo pipefail
          test -s AutoPoster.apk
          echo "BUILD_OK: AutoPoster.apk wurde gebaut, signiert und geprüft."
