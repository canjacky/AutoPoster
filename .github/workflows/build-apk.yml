name: Build & Release AutoPoster v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "AutoPoster_v2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Projekt entpacken
        run: |
          rm -rf AutoPoster
          unzip -o AutoPoster_v2.zip
          test -f AutoPoster/app/build.gradle.kts

      - name: Signierschlüssel robust vorbereiten
        env:
          KEYSTORE_B64: ${{ secrets.AUTPOSTER_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64, hashlib, sys

          raw = os.environ.get("KEYSTORE_B64", "")
          if not raw.strip():
              sys.exit("AUTPOSTER_KEYSTORE_B64 fehlt")

          EXPECTED_SHA = "a591601ffc288b091c5812fdc4bc0053851316aa7fc1d5c211b5e6361ffda82f"
          EXPECTED_BYTES = 3520
          EXPECTED_B64_LEN = 4696
          B64CHARS = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")

          def matches(enc: str):
              try:
                  if len(enc) % 4:
                      return None
                  data = base64.b64decode(enc, validate=True)
              except Exception:
                  return None
              if len(data) != EXPECTED_BYTES:
                  return None
              if hashlib.sha256(data).hexdigest() != EXPECTED_SHA:
                  return None
              return data

          # 1) Exakten bekannten Bezeichner entfernen und Whitespace beseitigen.
          cleaned = "".join(raw.replace("AUTPOSTER_KEYSTORE_B64", "").split())
          cleaned = "".join(ch for ch in cleaned if ch in B64CHARS)

          candidates = [cleaned]

          # 2) Falls vor dem eigentlichen Wert Text mitkopiert wurde: ab dem
          #    bekannten PKCS12/Base64-Anfang testen.
          start = cleaned.find("MIINvA")
          if start >= 0:
              candidates.append(cleaned[start:])

          # 3) Normale Kandidaten, sowie 4696-Zeichen-Fenster testen.
          seen = set()
          for c in list(candidates):
              if not c or c in seen:
                  continue
              seen.add(c)

              data = matches(c)
              if data is not None:
                  break

              if len(c) >= EXPECTED_B64_LEN:
                  for i in range(0, len(c) - EXPECTED_B64_LEN + 1):
                      data = matches(c[i:i + EXPECTED_B64_LEN])
                      if data is not None:
                          break
                  if data is not None:
                      break

              # 4) Häufiger Copy/Paste-Fehler: genau EIN zusätzliches gültiges
              #    Base64-Zeichen wurde eingefügt. Bei 4697 Zeichen probieren
              #    wir jede mögliche Ein-Zeichen-Entfernung und akzeptieren
              #    ausschließlich den Kandidaten mit dem festen SHA-256.
              if len(c) == EXPECTED_B64_LEN + 1:
                  for i in range(len(c)):
                      repaired = c[:i] + c[i+1:]
                      data = matches(repaired)
                      if data is not None:
                          print("Keystore-Secret automatisch repariert: 1 zusätzliches Zeichen entfernt")
                          break
                  if data is not None:
                      break
          else:
              data = None

          if data is None:
              sys.exit(
                  "Keystore-Secret konnte nicht eindeutig rekonstruiert werden. "
                  f"Bereinigte Länge: {len(cleaned)}; erwartet: {EXPECTED_B64_LEN}."
              )

          path = os.path.join(os.environ["RUNNER_TEMP"], "autoposter-release.jks")
          with open(path, "wb") as f:
              f.write(data)

          print(f"Keystore OK: {len(data)} Bytes, SHA-256 geprüft")
          PY

      - name: Signierschlüssel und Alias prüfen
        env:
          STORE_PASSWORD: ${{ secrets.AUTPOSTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTPOSTER_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "AUTPOSTER_STORE_PASSWORD fehlt" && exit 1)
          test -n "$KEY_ALIAS" || (echo "AUTPOSTER_KEY_ALIAS fehlt" && exit 1)
          keytool -list \
            -keystore "$RUNNER_TEMP/autoposter-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore-Passwort und Alias OK"

      - name: Signierte Release-APK bauen
        working-directory: AutoPoster
        env:
          AUTPOSTER_KEYSTORE_PATH: ${{ runner.temp }}/autoposter-release.jks
          AUTPOSTER_STORE_PASSWORD: ${{ secrets.AUTPOSTER_STORE_PASSWORD }}
          AUTPOSTER_KEY_ALIAS: ${{ secrets.AUTPOSTER_KEY_ALIAS }}
          AUTPOSTER_KEY_PASSWORD: ${{ secrets.AUTPOSTER_KEY_PASSWORD }}
        run: |
          test -n "$AUTPOSTER_KEY_PASSWORD" || (echo "AUTPOSTER_KEY_PASSWORD fehlt" && exit 1)
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AutoPoster.apk

      - name: APK-Signatur prüfen
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs AutoPoster.apk

      - name: Version ermitteln
        id: version
        run: |
          VERSION=$(grep -m1 'versionName = ' AutoPoster/app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-${{ steps.version.outputs.version }}-signed
          path: AutoPoster.apk
          if-no-files-found: error

      - name: GitHub Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AutoPoster.apk --clobber
          else
            gh release create "$TAG" AutoPoster.apk \
              --title "AutoPoster $TAG" \
              --notes "Signierte AutoPoster-Version. Installation/Update über Android." \
              --latest
          fi
