name: Build AutoPoster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AutoPoster_v1.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Projekt entpacken
        run: |
          unzip -o AutoPoster_v1.zip
          ls -la AutoPoster

      - name: Debug APK bauen
        working-directory: AutoPoster
        run: gradle :app:assembleDebug --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-debug-apk
          path: AutoPoster/app/build/outputs/apk/debug/app-debug.apk
